<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <title>ControlaAí — Fechamento contábil</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; height: 100%; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: oklch(0.97 0.008 260); color: oklch(0.28 0.02 265); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 260); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
    a { color: oklch(0.55 0.16 265); text-decoration: none; }
    a:hover { text-decoration: underline; }
    input, textarea, select, button { font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: 2px solid oklch(0.55 0.16 265 / 0.4); outline-offset: 0; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
